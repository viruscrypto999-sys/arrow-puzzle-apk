<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1240"><link rel="manifest" href="manifest.json"><title>Arrow Puzzle</title>
<style>
:root{--bg:#fff;--bg2:#e9edf4;--fg:#101424;--mut:#9aa3bd;--ac:#4685e6;--chip:#eff2f8;--ink:#0b1240;--ray:#d9deef;--dot:#c9cee3;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10152b;--bg2:#0a0e1d;--fg:#eef1ff;--mut:#7f89aa;--ac:#6f9cf0;--chip:#1c2340;--ink:#dbe3ff;--ray:#2a3358;--dot:#2c3558;--card:#171d36}}
:root[data-theme="dark"]{--bg:#10152b;--bg2:#0a0e1d;--fg:#eef1ff;--mut:#7f89aa;--ac:#6f9cf0;--chip:#1c2340;--ink:#dbe3ff;--ray:#2a3358;--dot:#2c3558;--card:#171d36}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg2);color:var(--fg);font-family:system-ui,-apple-system,sans-serif;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{max-width:520px;margin:0 auto;height:100%;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden}
.v{display:none;flex:1;flex-direction:column;min-height:0;overflow:auto}.v.on{display:flex}
nav{display:flex;border-top:1px solid var(--chip);padding:8px 0 6px}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px}nav button.on{color:var(--ac)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:40px;padding:14px 20px;font-size:18px;font-weight:700;width:100%}
.btn.w{background:var(--card);color:var(--ac);box-shadow:0 4px 16px #4685e633}
.btn small{display:block;font-size:13px;font-weight:500;opacity:.7}
#main{align-items:center;justify-content:space-between;padding:30px 28px;text-align:center}
.dc{background:linear-gradient(#7fb8f4,#3b82e6);color:#fff;border-radius:22px;padding:22px 34px;width:200px}
.dc small{display:block;opacity:.7;letter-spacing:1px;margin:10px 0 4px}.dc b{font-size:20px}
.dc button{margin-top:14px;background:#ffffff40;color:#fff;border:0;border-radius:30px;padding:8px 26px;font-weight:700;font-size:18px}
h1.ti{font-size:44px;color:#33415e;margin:0}
.col{width:100%;display:flex;flex-direction:column;gap:14px}
.hero{background:linear-gradient(#3f7fe0,#6db3ef);height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:19px;flex:none}
.hero div{font-size:90px;line-height:1.1}
.cal{padding:20px 22px;flex:1}.cal .h{display:flex;justify-content:space-between;font-weight:700;font-size:22px;margin-bottom:12px}
.g7{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;row-gap:8px}
.g7 i{font-style:normal;color:var(--mut);font-size:13px}.g7 b{font-size:18px;height:40px;width:40px;margin:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--mut);font-weight:600}
.g7 b.p{color:var(--fg)}.g7 b.t{background:var(--ac);color:#fff}.g7 b.s{color:#e9a521}
.pad{padding:12px 28px 18px}
#game{background:var(--bg)}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;font-weight:700;font-size:20px}
.top button{background:none;border:0;color:var(--ac);font-size:26px;width:40px}
.chips{display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.chip{background:var(--chip);border-radius:12px;padding:9px 14px;font-weight:700;color:var(--mut);min-width:64px;text-align:center}
#hp{font-size:30px;letter-spacing:4px}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
canvas{touch-action:manipulation}
.tools{display:flex;justify-content:center;gap:34px;padding:8px 0 18px}
.tool{position:relative;width:66px;height:66px;border-radius:50%;background:var(--card);border:0;box-shadow:0 4px 14px #0003;font-size:32px}
.tool.on{outline:3px solid var(--ac)}
.tool i{position:absolute;top:-6px;right:-6px;background:var(--ac);color:#fff;font-style:normal;font-size:14px;font-weight:700;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center}
#tip{position:absolute;background:var(--ac);color:#fff;padding:12px 22px;border-radius:14px;font-size:18px;display:none;pointer-events:none}
.sheet{position:absolute;inset:0;background:var(--bg2);display:none;flex-direction:column;z-index:5}.sheet.on{display:flex}
.sheet .top{background:var(--bg)}.sheet .top button{width:auto;font-size:18px}
.row{background:var(--card);border-radius:14px;margin:10px 14px 0;padding:18px;display:flex;justify-content:space-between;align-items:center;font-size:18px;border:0;width:calc(100% - 28px);color:var(--fg);text-align:left}
.sw{width:50px;height:30px;border-radius:20px;background:var(--chip);position:relative}.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px #0004;transition:.2s}
.sw.on{background:var(--ac)}.sw.on::after{left:23px}
.txt{padding:20px;line-height:1.5;color:var(--mut)}
.ov{position:absolute;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:6}.ov.on{display:flex}
.card{background:var(--card);border-radius:24px;padding:28px;width:80%;text-align:center;display:flex;flex-direction:column;gap:12px}.card h2{margin:0;font-size:26px}
.av{border-radius:50%;object-fit:cover;background:#fff;box-shadow:0 6px 20px #0003}
#splash{position:absolute;inset:0;z-index:20;background:#0b1240;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;transition:opacity .5s}
#splash .av{width:120px;height:120px}#splash b{font-size:26px;letter-spacing:4px}
.by{color:var(--mut);font-size:14px;margin:2px 0 0}
.prof img{width:64px;height:64px}.prof{gap:14px;justify-content:flex-start!important}
.in{width:64px;padding:6px;border-radius:8px;border:1px solid var(--mut);background:var(--card);color:var(--fg);text-align:center;font-size:16px}
#shc{flex:1;overflow:auto;padding-bottom:30px;-webkit-overflow-scrolling:touch}
.mini{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:8px 14px;font-weight:700}
</style></head><body>
<div id="app">
 <section class="v on" id="main"><div class="dc">🗓️<small>DAILY CHALLENGE</small><b id="dcd"></b><br><button id="dcp">Play</button></div>
  <div><img class="av" id="logo" data-av width="108" height="108" alt="Virus"><h1 class="ti" style="margin-top:8px">Arrow Puzzle</h1><div class="by" id="tg"></div></div>
  <div class="col"><button class="btn" id="cont">Continue Game<small id="cl"></small></button><button class="btn w" id="rst">Restart Game</button></div></section>
 <section class="v" id="daily"><div class="hero"><div>🏆</div>Daily Challenges</div>
  <div class="cal"><div class="h"><span id="mn"></span><span id="sc"></span></div><div class="g7" id="cg"></div></div>
  <div class="pad"><button class="btn" id="dpl">Play</button></div></section>
 <section class="v" id="me"><div class="top" style="justify-content:center">Me</div><div class="row prof"><img class="av" data-av alt="Virus"><div><b>Virus</b><div class="by" id="pf"></div></div></div>
  <button class="row" data-s="awards">🏆 Awards<span>›</span></button><button class="row" data-s="ach">🎮 Achievements<span>›</span></button>
  <button class="row" data-s="set">⚙️ Settings<span>›</span></button><button class="row" data-s="help">❓ Help<span>›</span></button><button class="row" data-s="about">ℹ️ About Game<span>›</span></button><button class="row" id="adm">🛡️ Admin<span>›</span></button></section>
 <section class="v" id="game"><div class="top"><button id="bk">‹</button><span id="gt"></span><button id="gs">⚙</button></div>
  <div class="chips"><div class="chip" id="al"></div><div id="hp"></div><div class="chip">Normal</div></div>
  <div id="stage"><canvas id="cv"></canvas><div id="tip">👆 Tap to remove</div></div>
  <div class="tools"><button class="tool" id="hint">💡<i id="hc"></i></button><button class="tool" id="rul">📏</button></div></section>
 <nav id="nav"><button data-v="main" class="on"><span>🏠</span>Main</button><button data-v="daily"><span>🗓️</span>Daily</button><button data-v="me"><span>👤</span>Me</button></nav>
 <div id="splash"><img class="av" data-av alt="Virus"><b>VIRUS</b><small style="opacity:.6">Arrow Puzzle</small></div>
 <div class="sheet" id="sh"><div class="top"><button id="shb">‹</button><span id="sht"></span><button id="shd">Done</button></div><div id="shc"></div></div>

function gen(){

function geom(s){const P=s.cells.map(([r,c])=>[(c+.5)*cs,(r+.5)*cs]);let L=0;

  else{s.bad=.4;if(!adm.god)lives--;beep(160,.2);vib(80);if(!lives){over_=true;setTimeout(()=>{over_=false;end(false);over_=true},450)}}ui()});

  ach:['Achievements',`<div class="txt">Levels cleared: ${lvl-1}<br>Daily challenges won: ${stars.length}</div>`],

  help:['Help','<div class="txt"><b>What is Arrow Puzzle?</b><br>Find free paths, tap arrows in the right order, and watch the cluttered grid become a clear, empty board. An arrow can only leave if nothing blocks its path. Blocked taps cost a heart. 💡 shows a free arrow, 📏 shows every arrow\'s path.</div>'],

let adm=Object.assign({lives:3,hints:null,god:0,tag:'by Virus'},ls('ap_adm',{}));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,Math.round(+v)||a));
function admin(){
  $('sht').textContent='Admin';$('sh').classList.add('on');const pin=ls('ap_pin',null);
  if(!admin.ok){
    $('shc').innerHTML=`<div class="txt">${pin?'Enter your PIN':'Set a 4-digit PIN for Admin'}<br><br><input id="pn" class="in" type="password" inputmode="numeric" maxlength="4" style="width:120px;font-size:24px"> <button class="mini" id="pg">OK</button><div id="pe" style="color:#e5484d;margin-top:8px"></div></div>`;
    $('pg').onclick=()=>{const v=$('pn').value;if(!/^\d{4}$/.test(v)){$('pe').textContent='4 digits only';return}
      if(!pin){sv('ap_pin',v);admin.ok=1;admin()}else if(v===pin){admin.ok=1;admin()}else $('pe').textContent='Wrong PIN'};return}
  const dn=new Date(today.getFullYear(),today.getMonth()+1,0).getDate();
  $('shc').innerHTML=`<div class="txt" style="padding-bottom:4px">${admin.msg?'<b style="color:var(--ac)">'+admin.msg+'</b><br>':''}Welcome back, Virus 🛡️<br>Level ${lvl} • ⭐ ${stars.length} • saved on this device only</div>
<div class="row">Play current level now<button class="mini" data-a="play">▶ Play</button></div>
<div class="row">Go to level<span><input id="a1" class="in" type="number" min="1" value="${lvl}"> <button class="mini" data-a="lvl">Set</button></span></div>
<div class="row">Lives per level<span><input id="a2" class="in" type="number" min="1" max="5" value="${adm.lives}"> <button class="mini" data-a="lives">Set</button></span></div>
<div class="row">Free hints<span><input id="a3" class="in" type="number" min="0" max="9" value="${adm.hints==null?'':adm.hints}" placeholder="auto"> <button class="mini" data-a="hints">Set</button></span></div>
<div class="row">Never lose hearts<div class="sw ${adm.god?'on':''}" data-a="god"></div></div>
<div class="row">Tagline<span><input id="a4" class="in" style="width:110px;text-align:left" value="${adm.tag}"> <button class="mini" data-a="tag">Set</button></span></div>
<div class="row">Skip current level<button class="mini" data-a="skip">Skip</button></div>
<div class="row">All daily stars (${MN[today.getMonth()]})<button class="mini" data-a="stars">Give</button></div>
<div class="row">Reset progress<button class="mini" data-a="reset" style="background:#e5484d">Reset</button></div>
<div class="row">Change PIN<button class="mini" data-a="pin">Change</button></div>`;
  $('shc').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a;
    if(a==='lvl'){lvl=Math.max(1,Math.round(+$('a1').value)||1);sv('ap_lvl',lvl)}
    else if(a==='lives')adm.lives=clamp($('a2').value,1,5);
    else if(a==='hints'){const v=$('a3').value;adm.hints=v===''?null:clamp(v,0,9)}
    else if(a==='god'){adm.god^=1;b.classList.toggle('on',!!adm.god)}
    else if(a==='tag')adm.tag=$('a4').value.trim()||'by Virus';
    else if(a==='skip'){lvl++;sv('ap_lvl',lvl)}
    else if(a==='stars'){for(let d=1;d<=dn;d++){const k=today.getFullYear()+'-'+(today.getMonth()+1)+'-'+d;if(!stars.includes(k))stars.push(k)}sv('ap_stars',stars)}
    else if(a==='reset'){if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent='Tap again';return}lvl=1;stars=[];sv('ap_lvl',1);sv('ap_stars',[])}
    else if(a==='play'){$('sh').classList.remove('on');start();return}
    else if(a==='pin'){admin.ok=0;sv('ap_pin',null)}
    sv('ap_adm',adm);mainUI();admin.msg='✓ Saved (applies when a level starts)';admin()})}
$('adm').onclick=()=>{admin.msg='';admin()};
